name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "vibe/**"

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, dom, intl, json, zip
          tools: composer
      - name: PHP-Syntax lint
        run: composer run lint

  php-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, dom, intl, json, zip
          tools: composer
      - name: Abhaengigkeiten installieren
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: composer run test:unit

  node-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund
      - name: TypeScript-Check
        run: npm run tsc
      - name: Build
        run: npm run build
