[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tagebuch-linux"
version = "0.1.0"
description = "Privates Tagebuch fuer Linux: taegliche Eintraege als Markdown-Dateien (*.md) in der eigenen Nextcloud (WebDAV) – Funktions-Nachbau von Diarium."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "PyYAML==6.0.3",
]

[project.scripts]
tagebuch = "tagebuch.cli:main"
tagebuch-gui = "tagebuch.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
