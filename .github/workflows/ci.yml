name: CI

on:
  push:
    branches:
      - "vibe/**"
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Abhaengigkeiten installieren (Lockfile)
        run: pip install -r requirements-dev.txt
      - name: Paket installieren (src-Layout)
        run: pip install .
      - name: Lint
        run: ruff check src tests
      - name: Syntax/Compile
        run: python -m compileall -q src
      - name: Tests
        run: pytest -q
