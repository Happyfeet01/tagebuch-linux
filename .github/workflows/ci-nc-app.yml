name: CI nc-app

on:
  pull_request:
    paths:
      - "nc-app/**"
      - ".github/workflows/ci-nc-app.yml"
  push:
    branches:
      - main
      - "vibe/**"
    paths:
      - "nc-app/**"
      - ".github/workflows/ci-nc-app.yml"

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, dom, intl, json, zip, imap
          tools: composer
      - name: PHP-Syntax lint
        working-directory: nc-app
        run: composer run lint

  php-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, dom, intl, json, zip, imap
          tools: composer
      - name: Abhaengigkeiten installieren
        working-directory: nc-app
        run: composer install --no-interaction --no-progress
      - name: ExifTool für den Metadatentest installieren
        run: sudo apt-get update -qq && sudo apt-get install -y libimage-exiftool-perl
      - name: PHPUnit
        working-directory: nc-app
        run: composer run test:unit

  node-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nc-app/package-lock.json
      - name: Abhaengigkeiten installieren
        working-directory: nc-app
        run: npm ci --no-audit --no-fund
      - name: TypeScript-Check
        working-directory: nc-app
        run: npm run tsc
      - name: Importtests
        working-directory: nc-app
        run: node --experimental-strip-types --test tests/frontend/*.test.mjs
      - name: Build
        working-directory: nc-app
        run: npm run build
      - name: Installationspaket erstellen
        id: package
        working-directory: nc-app
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('appinfo/info.xml').findtext('version'))")
          tar --transform='s,^,tagebuch/,' -czf "../tagebuch-$version.tar.gz" appinfo css img js lib templates LICENSE
          set -o pipefail
          entry="tagebuch-main-${version//./-}"
          tar -xOzf "../tagebuch-$version.tar.gz" "tagebuch/js/$entry.js" | node -e 'const src = require("fs").readFileSync(0, "utf8"); if (!src.trim()) process.exit(1); new (require("vm").Script)(src)'
          tar -tzf "../tagebuch-$version.tar.gz" "tagebuch/css/$entry.css"
          echo "name=tagebuch-$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
